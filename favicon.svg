<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Indigo to Cobalt & Midnight Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Golden Tassel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow for Mortarboard Depth -->
    <filter id="capShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#020617" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Bevel -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="url(#rimGrad)" stroke-width="1.2" />

  <!-- Cap Skull Base -->
  <path
    d="M 19 32.5 L 19 40.5 C 19 46.5 45 46.5 45 40.5 L 45 32.5 C 40.8 35.8 35.6 37 32 37 C 28.4 37 23.2 35.8 19 32.5 Z"
    fill="#CBD5E1"
    filter="url(#capShadow)"
  />
  <path
    d="M 21 34.5 L 21 40 C 21 44.5 43 44.5 43 40 L 43 34.5 C 39.5 36.8 35.5 37.5 32 37.5 C 28.5 37.5 24.5 36.8 21 34.5 Z"
    fill="#F8FAFC"
  />

  <!-- Mortarboard Rhombus Top with 3D Dimensional Facets -->
  <!-- Left Bright Facet -->
  <path
    d="M 32 17 L 11 27 L 32 36 Z"
    fill="#FFFFFF"
    filter="url(#capShadow)"
  />
  <!-- Right Shaded Facet -->
  <path
    d="M 32 17 L 53 27 L 32 36 Z"
    fill="#E2E8F0"
    filter="url(#capShadow)"
  />

  <!-- Subtle Cap Center Seam Highlight -->
  <line x1="32" y1="17" x2="32" y2="36" stroke="#F1F5F9" stroke-width="0.8" />

  <!-- Golden Center Button / Pivot -->
  <circle cx="32" cy="26.5" r="2.4" fill="url(#goldGrad)" filter="url(#capShadow)" />

  <!-- Golden Tassel Cord and Swag -->
  <path
    d="M 32 26.5 Q 43 28 46.5 34 L 46.5 43"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Tassel Brush / Ring & Fringe -->
  <circle cx="46.5" cy="43.5" r="1.6" fill="#F59E0B" />
  <path
    d="M 45 44.5 L 48 44.5 L 49.5 50.5 L 43.5 50.5 Z"
    fill="url(#goldGrad)"
    rx="1"
  />

  <!-- Subtle Accent: Golden Computing Sparkle (Top Left) -->
  <polygon
    points="13,13 14.5,10 16,13 19,14.5 16,16 14.5,19 13,16 10,14.5"
    fill="#FDE047"
    opacity="0.9"
  />
</svg>
